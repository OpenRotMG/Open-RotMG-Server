name: Server release
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install pinned Rust
        run: rustup toolchain install 1.94.1 --profile minimal --component clippy,rustfmt
      - name: Check and test
        run: |
          cargo +1.94.1 fmt -- --check
          cargo +1.94.1 test --locked
          cargo +1.94.1 clippy --locked --all-targets -- -D warnings
          cargo +1.94.1 build --locked
          export OPENROTMG_BACKUP_BINARY="$PWD/target/debug/openrotmg"
          python3 -B -W error::ResourceWarning -m unittest discover -s scripts/backups -p 'test_*.py'
          python3 -B -m unittest discover -s scripts -p test_run.py
          python3 -B -m unittest discover -s scripts/deploy -p 'test_*.py'
      - name: Build compatible release
        run: |
          cargo +1.94.1 build --locked --release
          python3 scripts/deploy/package.py "$GITHUB_SHA" target/release/openrotmg dist
          mkdir staged-release
          tar -xzf dist/server.tar.gz -C staged-release
          cargo +1.94.1 test --locked --no-run --message-format=json > test-executables.jsonl
          python3 - <<'PY'
          import json, pathlib, subprocess
          artifacts = [json.loads(line) for line in pathlib.Path('test-executables.jsonl').read_text().splitlines()]
          tests = [pathlib.Path(a['executable']).resolve() for a in artifacts if a.get('executable') and a.get('profile', {}).get('test') and a['target']['name'] == 'openrotmg']
          if len(tests) != 1:
              raise RuntimeError(f'Expected one server test executable, got {tests}')
          subprocess.run([str(tests[0]), 'world::realm_maps_tests::', '--nocapture'], cwd='staged-release', check=True)
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: server-${{ github.sha }}
          path: dist/
          if-no-files-found: error
  publish:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: server-${{ github.sha }}
          path: dist
      - name: Publish immutable revision
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "server-$GITHUB_SHA" dist/server.tar.gz dist/release.json \
            --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --latest=false --draft \
            --title "Server ${GITHUB_SHA:0:7}" --notes "Tested server build for $GITHUB_SHA"
          gh release edit "server-$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
